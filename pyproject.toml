[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "architectpass-state"
version = "0.7.1"
description = "Provider-independent state and private material pipeline for ArchitectPass"
requires-python = ">=3.11"
dependencies = ["pdfplumber==0.11.9"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
