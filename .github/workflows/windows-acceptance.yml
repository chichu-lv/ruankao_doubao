name: Windows offline acceptance
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare distributable Windows runtime
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/download_windows_runtime.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install from bundled files
        id: install
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/acceptance | Out-Null
          cmd /c scripts\start_windows.cmd --prepare-only 2>&1 | Tee-Object dist/acceptance/windows-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full Windows regression suite
        id: unit
        shell: pwsh
        run: |
          & .runtime/python/python.exe -X utf8 -c "import sys; print(sys.version); print(sys.path)" | Set-Content -Encoding utf8 dist/acceptance/windows-path.log
          & .runtime/python/python.exe -X utf8 -m unittest discover -s tests/unit -v 2>&1 | Tee-Object dist/acceptance/windows-unit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: New user without Git or Python on PATH
        id: clean
        shell: pwsh
        run: |
          & .runtime/python/python.exe -X utf8 scripts/test_windows_clean_install.py 2>&1 | Tee-Object dist/acceptance/windows-clean.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Public source installation without Git or Python
        id: public
        shell: pwsh
        run: |
          try {
            & scripts/test_windows_public_install.ps1 2>&1 | Tee-Object dist/acceptance/windows-public-install.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } catch {
            Write-Output "::error title=Public source installation::$($_.Exception.Message)"
            exit 1
          }
      - name: Record acceptance outcomes for artifact
        if: always()
        shell: pwsh
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
          PUBLIC_OUTCOME: ${{ steps.public.outcome }}
        run: |
          New-Item -ItemType Directory -Force dist/acceptance | Out-Null
          @{source_commit=$env:GITHUB_SHA; run_id=$env:GITHUB_RUN_ID; install=$env:INSTALL_OUTCOME; unit=$env:UNIT_OUTCOME; clean=$env:CLEAN_OUTCOME; public=$env:PUBLIC_OUTCOME} | ConvertTo-Json | Set-Content -Encoding utf8 dist/acceptance/windows-outcome.json
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-acceptance
          path: dist/acceptance/windows-*
