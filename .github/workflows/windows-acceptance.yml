name: Windows offline acceptance
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare distributable Windows runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor/wheels-windows | Out-Null
          Invoke-WebRequest https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip -OutFile vendor/python-windows-amd64.zip
          python -m pip download --only-binary=:all: --dest vendor/wheels-windows pdfplumber==0.11.9
      - name: Install from bundled files
        id: install
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/acceptance | Out-Null
          cmd /c scripts\start_windows.cmd --prepare-only 2>&1 | Tee-Object dist/acceptance/windows-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full Windows regression suite
        id: unit
        shell: pwsh
        run: |
          & .runtime/python/python.exe -X utf8 -m unittest discover -s tests/unit -v 2>&1 | Tee-Object dist/acceptance/windows-unit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: New user without Git or Python on PATH
        id: clean
        shell: pwsh
        run: |
          & .runtime/python/python.exe -X utf8 scripts/test_windows_clean_install.py 2>&1 | Tee-Object dist/acceptance/windows-clean.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record acceptance results on test branch
        if: always()
        shell: pwsh
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
        run: |
          New-Item -ItemType Directory -Force dist/acceptance | Out-Null
          @{source_commit=$env:GITHUB_SHA; run_id=$env:GITHUB_RUN_ID; install=$env:INSTALL_OUTCOME; unit=$env:UNIT_OUTCOME; clean=$env:CLEAN_OUTCOME} | ConvertTo-Json | Set-Content -Encoding utf8 dist/acceptance/windows-outcome.json
          git config user.name 'ArchitectPass acceptance'
          git config user.email 'acceptance@users.noreply.github.com'
          git fetch origin codex/windows-acceptance 2>$null
          $hasParent = $LASTEXITCODE -eq 0
          $parent = if ($hasParent) { git rev-parse FETCH_HEAD } else { '' }
          $env:GIT_INDEX_FILE = Join-Path $env:RUNNER_TEMP 'acceptance-index'
          git add -f -- dist/acceptance
          $tree = git write-tree
          $commit = if ($hasParent) { git commit-tree $tree -p $parent -m "Windows acceptance $env:GITHUB_SHA" } else { git commit-tree $tree -m "Windows acceptance $env:GITHUB_SHA" }
          git push origin "${commit}:refs/heads/codex/windows-acceptance"
          exit $LASTEXITCODE
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-acceptance
          path: dist/acceptance/windows-*.json
